name: macOS Desktop DMG

# Diagnosis-only branch. Never merge this replacement workflow into the product.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-sidebar-diag-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-native-smoke:
    name: Intel historical-package sidebar diagnosis (not release acceptance)
    if: github.ref == 'refs/heads/codex/desktop-0.5.7-mac-sidebar-diag'
    runs-on: macos-15-intel
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify frozen product and historical helper parity
        run: |
          [[ "$(uname -m)" == "x86_64" ]]
          git merge-base --is-ancestor 7f544cd31c43f239c09c3a209ae0d05fe677c710 HEAD
          git diff --exit-code ba93a61a69e3a236c2f84e8fab4299285168035b 7f544cd31c43f239c09c3a209ae0d05fe677c710 -- \
            apps/desktop/src apps/desktop/extensions apps/web/src packages \
            apps/desktop/tests/packaged-smoke.ts apps/desktop/tests/turn-navigation-viewport.ts
          git diff --exit-code 7f544cd31c43f239c09c3a209ae0d05fe677c710 HEAD -- \
            apps/desktop/src apps/desktop/extensions apps/web/src packages \
            apps/desktop/tests/packaged-smoke.ts apps/desktop/tests/turn-navigation-viewport.ts
          git diff --quiet HEAD --

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install only the existing test driver dependencies
        run: pnpm install --frozen-lockfile

      - name: Load host fixture native dependency (never rebuild the app)
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'
          const require = createRequire(new URL('./packages/session/session-persistence-jsonl/package.json', 'file://' + process.cwd() + '/'))
          require('fs-ext')
          console.log('Host fs-ext ready; ABI=' + process.versions.modules)
          NODE

      - name: Read exactly one known historical candidate artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '10097278922'
          run-id: '34332886003'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/macos-sidebar-historical
          merge-multiple: true

      - name: Diagnose one original sidebar preparation and up to three independent resizes
        env:
          DSH_MACOS_SIDEBAR_DIAGNOSTIC_DMG: ${{ runner.temp }}/macos-sidebar-historical/DeepSeek-Harness-0.5.7-mac-x64.dmg
          DSH_MACOS_SIDEBAR_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/macos-sidebar-diagnostic
        run: |
          env -u NODE_PATH -u NODE_OPTIONS node node_modules/vitest/vitest.mjs run \
            apps/desktop/tests/macos-sidebar-diagnostic.spec.ts --config vitest.config.ts

      - name: Preserve bounded diagnosis even when the original assertion fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macOS-sidebar-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/macos-sidebar-diagnostic/diagnostic.json
            ${{ runner.temp }}/macos-sidebar-diagnostic/cleanup.json
            ${{ runner.temp }}/macos-sidebar-diagnostic/sidebar.png
          if-no-files-found: error
          retention-days: 7
