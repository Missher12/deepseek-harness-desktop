name: Desktop Release Tooling

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  tooling:
    name: Release tooling validation only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tooling only
        run: >-
          pnpm exec vitest run
          scripts/create-desktop-update-manifest.spec.ts
          apps/desktop/tests/update-release.spec.ts
          scripts/ci-workflow.spec.ts
          --config vitest.config.ts

      - name: Record verification scope
        run: |
          printf '%s\n' \
            'Tooling validation only: manifest generation, parsing and workflow restrictions.' \
            'Native acceptance and publication require the coordinator procedure in apps/desktop/releasing/README.md.' \
            >> "$GITHUB_STEP_SUMMARY"
