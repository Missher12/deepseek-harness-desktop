name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft desktop release tag to publish
        required: true
        type: string
        default: desktop-v0.2.1

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  mac:
    name: Intel macOS DMG
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Intel macOS DMG
        run: pnpm run desktop:dmg

      - name: Exercise the packaged application
        run: pnpm exec vitest run apps/desktop/tests/packaged-smoke.spec.ts --config vitest.config.ts

      - name: Verify the disk image and record SHA-256
        run: |
          artifact=DeepSeek-Harness-0.2.1-mac-x64.dmg
          hdiutil verify "apps/desktop/release/$artifact"
          cd apps/desktop/release
          shasum -a 256 "$artifact" > "$artifact.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-x64
          path: |
            apps/desktop/release/DeepSeek-Harness-0.2.1-mac-x64.dmg
            apps/desktop/release/DeepSeek-Harness-0.2.1-mac-x64.dmg.sha256
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows x64 Setup
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        working-directory: s
    steps:
      - uses: actions/checkout@v6
        with:
          path: s
          persist-credentials: false

      - name: Enable Developer Mode for workspace symlinks
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install immutable dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build the assisted Windows Setup
        shell: pwsh
        run: |
          $env:DSH_DESKTOP_STAGE_DIR = Join-Path $env:RUNNER_TEMP 'dsh-desktop-stage'
          pnpm run desktop:stage
          pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --projectDir "$env:DSH_DESKTOP_STAGE_DIR" --config "$env:DSH_DESKTOP_STAGE_DIR\electron-builder.yml" --win nsis --x64
          $builtArtifact = Join-Path (Split-Path -Parent $env:DSH_DESKTOP_STAGE_DIR) 'release\DeepSeek-Harness-Setup-0.2.1-win-x64.exe'
          $workspaceArtifact = 'apps/desktop/release/DeepSeek-Harness-Setup-0.2.1-win-x64.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $workspaceArtifact) | Out-Null
          Copy-Item -LiteralPath $builtArtifact -Destination $workspaceArtifact

      - name: Exercise the visible installer pages
        shell: pwsh
        run: >-
          ./scripts/windows-desktop-installer-ui-smoke.ps1
          -SetupPath apps/desktop/release/DeepSeek-Harness-Setup-0.2.1-win-x64.exe

      - name: Install and exercise the packaged application lifecycle
        shell: pwsh
        run: >-
          ./scripts/windows-desktop-setup-smoke.ps1
          -SetupPath apps/desktop/release/DeepSeek-Harness-Setup-0.2.1-win-x64.exe

      - name: Record SHA-256
        shell: pwsh
        run: |
          $artifact = 'apps/desktop/release/DeepSeek-Harness-Setup-0.2.1-win-x64.exe'
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$hash  $(Split-Path -Leaf $artifact)`n"
          [System.IO.File]::WriteAllText("$artifact.sha256", $checksum, [System.Text.Encoding]::ASCII)

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x64
          path: |
            s/apps/desktop/release/DeepSeek-Harness-Setup-0.2.1-win-x64.exe
            s/apps/desktop/release/DeepSeek-Harness-Setup-0.2.1-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Verify and publish desktop release
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-x64
          path: release
          merge-multiple: true

      - name: Verify release assets
        run: |
          cd release
          shasum -a 256 -c DeepSeek-Harness-0.2.1-mac-x64.dmg.sha256
          shasum -a 256 -c DeepSeek-Harness-Setup-0.2.1-win-x64.exe.sha256

      - name: Upload assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            release/DeepSeek-Harness-0.2.1-mac-x64.dmg \
            release/DeepSeek-Harness-0.2.1-mac-x64.dmg.sha256 \
            release/DeepSeek-Harness-Setup-0.2.1-win-x64.exe \
            release/DeepSeek-Harness-Setup-0.2.1-win-x64.exe.sha256 \
            --clobber
          gh release edit "${{ inputs.tag }}" --draft=false --target "$GITHUB_SHA"
