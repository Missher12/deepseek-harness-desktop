name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft desktop release tag to publish
        required: true
        type: string
        default: desktop-v0.5.2

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  mac:
    name: Intel macOS DMG
    runs-on: macos-15-intel
    timeout-minutes: 60
    outputs:
      version: ${{ steps.desktop.outputs.version }}
      artifact: ${{ steps.desktop.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve Desktop release metadata
        id: desktop
        run: |
          if [[ "$GITHUB_REF" != "refs/tags/${{ inputs.tag }}" ]]; then
            echo "Release workflow must be dispatched from tag ${{ inputs.tag }}, got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit does not match the workflow SHA" >&2
            exit 1
          fi
          version=$(node -p "require('./apps/desktop/package.json').version")
          harness=$(node -p "require('./apps/desktop/update-metadata.json').harnessVersion")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Desktop version: $version" >&2
            exit 1
          fi
          if [[ "${{ inputs.tag }}" != "desktop-v$version" ]]; then
            echo "Release tag ${{ inputs.tag }} does not match Desktop $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          echo "artifact=DeepSeek-Harness-$version-mac-x64.dmg" >> "$GITHUB_OUTPUT"

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Intel macOS DMG
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run desktop:dmg

      - name: Exercise the packaged application
        run: pnpm exec vitest run apps/desktop/tests/packaged-smoke.spec.ts --config vitest.config.ts

      - name: Verify the disk image and record SHA-256
        run: |
          artifact='${{ steps.desktop.outputs.artifact }}'
          hdiutil verify "apps/desktop/release/$artifact"
          cd apps/desktop/release
          shasum -a 256 "$artifact" > "$artifact.sha256"

      - name: Generate verified Desktop update manifest
        run: >-
          pnpm exec tsx scripts/create-desktop-update-manifest.ts
          apps/desktop/release/${{ steps.desktop.outputs.artifact }}
          apps/desktop/release/deepseek-harness-desktop-update.json
          ${{ steps.desktop.outputs.version }}
          ${{ steps.desktop.outputs.harness }}
          "${{ inputs.tag }}"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-x64
          path: |
            apps/desktop/release/${{ steps.desktop.outputs.artifact }}
            apps/desktop/release/${{ steps.desktop.outputs.artifact }}.sha256
            apps/desktop/release/deepseek-harness-desktop-update.json
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows x64 Setup full validation
    uses: ./.github/workflows/windows-desktop.yml
    with:
      mode: full

  publish:
    name: Verify and publish desktop release
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-mac-x64
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.windows.outputs.artifact-name }}
          path: release

      - name: Verify release assets
        run: |
          cd release
          shasum -a 256 -c '${{ needs.mac.outputs.artifact }}.sha256'
          shasum -a 256 -c '${{ needs.windows.outputs.artifact }}.sha256'

      - name: Upload assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            'release/${{ needs.mac.outputs.artifact }}' \
            'release/${{ needs.mac.outputs.artifact }}.sha256' \
            release/deepseek-harness-desktop-update.json \
            'release/${{ needs.windows.outputs.artifact }}' \
            'release/${{ needs.windows.outputs.artifact }}.sha256' \
            --clobber
          gh release edit "${{ inputs.tag }}" --draft=false --target "$GITHUB_SHA"
