name: Windows Desktop Setup

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-install-smoke:
    name: build, install, launch, and uninstall
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: s
    steps:
      - uses: actions/checkout@v6
        with:
          path: s
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        id: source
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "source revision mismatch: expected $expected, got $actual"
          }
          "sha=$actual" >> $env:GITHUB_OUTPUT

      - name: Parse Windows Desktop PowerShell smokes
        shell: pwsh
        run: |
          $scriptNames = @(
            'scripts/windows-desktop-setup-smoke.ps1'
            'scripts/windows-desktop-native-visual-smoke.ps1'
            'scripts/windows-desktop-installer-ui-smoke.ps1'
          )
          foreach ($scriptName in $scriptNames) {
            $tokens = $null
            $parseErrors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              [System.IO.Path]::GetFullPath($scriptName),
              [ref]$tokens,
              [ref]$parseErrors
            )
            if (@($parseErrors).Count -eq 0) {
              if ($scriptName -eq 'scripts/windows-desktop-installer-ui-smoke.ps1') {
                $nativeClass = @($ast.FindAll({
                  param($node)
                  $node -is [System.Management.Automation.Language.StringConstantExpressionAst] -and
                    $node.Value.Contains('public static class NativeInstallerWindow')
                }, $true))
                if ($nativeClass.Count -ne 1) { throw 'Expected one native installer observer implementation.' }
                Add-Type -TypeDefinition $nativeClass[0].Value
              }
              continue
            }
            $fileName = [System.IO.Path]::GetFileName($scriptName)
            foreach ($parseError in @($parseErrors)) {
              $lineNumber = $parseError.Extent.StartLineNumber
              $columnNumber = $parseError.Extent.StartColumnNumber
              Write-Output ('{0}:{1}:{2}: {3}' -f $fileName, $lineNumber, $columnNumber, $parseError.Message)
            }
            throw "PowerShell parse failed for $fileName."
          }

      - name: Enable Developer Mode for workspace symlinks
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install immutable dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Exercise legacy fallback migration contracts
        shell: pwsh
        run: >-
          pnpm exec vitest run
          packages/boot/app-boot/tests/profile.spec.ts
          apps/desktop/tests/packaged-smoke-helpers.spec.ts
          scripts/windows-desktop-runtime-evidence.spec.ts
          scripts/windows-desktop-installer-ui-smoke.spec.ts
          scripts/windows-desktop-update-handoff.spec.ts
          apps/desktop/tests/preload-api.spec.ts
          apps/desktop/tests/update-release.spec.ts
          apps/desktop/tests/update-service.spec.ts
          apps/desktop/tests/update-service-platforms.spec.ts
          apps/desktop/tests/update-install.spec.ts
          apps/desktop/tests/update-helper.spec.ts
          apps/desktop/tests/windows-update-installer.spec.ts
          apps/desktop/tests/linux-installer.spec.ts
          packages/client/ui-settings-system-update
          --config vitest.config.ts
          --reporter=verbose

      - name: Resolve Desktop release metadata
        id: desktop
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'apps/desktop/package.json' -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Desktop package version must be major.minor.patch, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=DeepSeek-Harness-Setup-$version-win-x64.exe" >> $env:GITHUB_OUTPUT

      - name: Build the assisted Windows Setup
        shell: pwsh
        run: |
          $env:DSH_DESKTOP_STAGE_DIR = Join-Path $env:RUNNER_TEMP 'dsh-desktop-stage'
          pnpm run desktop:stage
          pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --projectDir "$env:DSH_DESKTOP_STAGE_DIR" --config "$env:DSH_DESKTOP_STAGE_DIR\electron-builder.yml" --win nsis --x64
          $artifact = '${{ steps.desktop.outputs.artifact }}'
          $builtArtifact = Join-Path (Split-Path -Parent $env:DSH_DESKTOP_STAGE_DIR) "release\$artifact"
          $workspaceArtifact = Join-Path 'apps/desktop/release' $artifact
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $workspaceArtifact) | Out-Null
          Copy-Item -LiteralPath $builtArtifact -Destination $workspaceArtifact
          $unpacked = Join-Path (Split-Path -Parent $env:DSH_DESKTOP_STAGE_DIR) 'release\win-unpacked'
          $inventoryPath = [System.IO.Path]::GetFullPath('apps/desktop/release/desktop-package-staged.json')
          $manifestPath = [System.IO.Path]::GetFullPath('apps/desktop/package.json')
          pnpm --filter '@deepseek-ai/dsh-desktop' run inventory:package --output $inventoryPath --policy windows-x64 --manifest $manifestPath $unpacked
          if ($LASTEXITCODE -ne 0) { throw "Staged package inventory failed with exit code $LASTEXITCODE." }
          $setupFile = Get-Item -LiteralPath $workspaceArtifact
          $setupEvidence = [ordered]@{
            schemaVersion = 1
            path = $setupFile.Name
            bytes = $setupFile.Length
            sha256 = (Get-FileHash -LiteralPath $setupFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          [System.IO.File]::WriteAllText(
            'apps/desktop/release/desktop-package-setup.json',
            (($setupEvidence | ConvertTo-Json) + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Verify Windows system paths without changing packaged bytes
        env:
          ARTIFACT: ${{ steps.desktop.outputs.artifact }}
          NODE_OPTIONS: ''
          NODE_PATH: ''
        shell: pwsh
        run: |
          @'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { spawnSync } from 'node:child_process'
          import { createReadStream } from 'node:fs'
          import { mkdtemp, readFile, readdir, realpath, rm, writeFile } from 'node:fs/promises'
          import { createRequire } from 'node:module'
          import { isAbsolute, join, relative, resolve } from 'node:path'
          import { pathToFileURL } from 'node:url'

          const release = join(process.env.RUNNER_TEMP, 'release')
          const resources = join(release, 'win-unpacked', 'resources')
          const unpacked = join(resources, 'app.asar.unpacked')
          async function fingerprint() {
            const native = (await readdir(unpacked, { recursive: true }))
              .filter(name => name.endsWith('.node')).sort()
            assert(native.length > 0, 'Packaged native binaries are missing')
            const files = [
              join('apps/desktop/release', process.env.ARTIFACT),
              join(release, process.env.ARTIFACT),
              join(release, 'win-unpacked', 'DeepSeek Harness.exe'),
              join(resources, 'app.asar'),
              ...native.map(name => join(unpacked, name)),
            ]
            return Promise.all(files.map(async file => {
              const hash = createHash('sha256')
              for await (const chunk of createReadStream(file)) hash.update(chunk)
              return [file, hash.digest('hex')]
            }))
          }

          assert.equal(process.platform, 'win32', 'System-path validation requires Windows')
          assert.equal(process.versions.electron, undefined, 'Host validation requires plain Node')
          async function verifyFlockEntry(manifest, root) {
            const entry = await realpath(createRequire(manifest).resolve('@deepseek-ai/node-addon-system/flock'))
            const local = relative(await realpath(root), entry)
            assert(local && !isAbsolute(local) && local !== '..' && !local.startsWith('..\\'),
              'System entry escaped its host or packaged dependency root')
            const { tryLockExclusive } = await import(pathToFileURL(entry).href)
            assert.equal(typeof tryLockExclusive, 'function')
            // Windows imports this lazy POSIX entry, but must never require a POSIX addon.
            await assert.rejects(tryLockExclusive(-1), { code: 'ERR_FLOCK_UNSUPPORTED_PLATFORM' })
          }

          function describeFailure(error) {
            if (error === undefined || error === null) return null
            const text = (value, limit) => String(value).replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, limit)
            return { name: text(error.name ?? 'Error', 64), code: text(error.code ?? '', 64),
              message: text(error.message ?? error, 512) }
          }

          // Serialized into a private file and executed only by the packaged Electron binary.
          async function verifyEmbeddedWindowsJob(config, describeFailure) {
            const { default: assert } = await import('node:assert/strict')
            const { realpath, writeFile } = await import('node:fs/promises')
            const { createRequire } = await import('node:module')
            const { isAbsolute, join, relative } = await import('node:path')
            const { pathToFileURL } = await import('node:url')
            const owned = new Set()
            const handles = []
            let fiber
            let phase = 'runtime'
            const report = { schemaVersion: 1, primaryOk: false, cleanupOk: false, phase, owned: [],
              primaryError: null, cleanupError: null }
            async function bounded(promise) {
              let timer
              try {
                return await Promise.race([promise, new Promise((_, reject) => {
                  timer = setTimeout(() => reject(new Error('Embedded Job observation timed out')), 5000)
                })])
              } finally { clearTimeout(timer) }
            }
            async function until(predicate) {
              const deadline = Date.now() + 5000
              while (!predicate()) {
                assert(Date.now() < deadline, 'Embedded Job state did not converge')
                await new Promise(resolve => setTimeout(resolve, 25))
              }
            }
            function gone(pid) {
              try { process.kill(pid, 0); return false }
              catch (error) { if (error.code === 'ESRCH') return true; throw error }
            }
            try {
              assert.equal(process.platform, 'win32')
              assert.equal(process.versions.electron, config.electron)
              assert.equal(await realpath(process.execPath), config.executable)
              const root = await realpath(config.unpacked)
              const require = createRequire(join(root, 'node_modules/@deepseek-ai/dsh-subprocess-local/package.json'))
              async function entry(name) {
                const file = await realpath(require.resolve(name))
                const local = relative(root, file)
                assert(local && !isAbsolute(local) && local !== '..' && !local.startsWith('..\\'), 'Dependency escaped packaged root')
                return pathToFileURL(file).href
              }
              phase = 'bindings'
              const native = await import(await entry('@deepseek-ai/dsh-win32-process'))
              const api = native.loadWin32ProcessBindings()
              assert.equal(typeof api.uvGetOsfhandle, 'function')
              native.probeCurrentTokenJobSupport(api)
              await entry('@deepseek-ai/dsh-subprocess-local/runner')
              const { Context } = await import(await entry('@deepseek-ai/cordis'))
              const { default: LocalSubprocessRuntime } = await import(await entry('@deepseek-ai/dsh-subprocess-local'))
              const ctx = new Context()
              fiber = await bounded(ctx.plugin(LocalSubprocessRuntime))
              async function target() {
                const mode = process.argv[2]
                process.stdout.write(JSON.stringify({ pid: process.pid, parent: process.ppid,
                  executable: process.execPath, electron: process.versions.electron }) + '\n')
                let input = ''
                process.stdin.setEncoding('utf8')
                process.stdin.on('data', chunk => { input += chunk })
                process.stdin.on('end', () => {
                  process.stdout.write(input)
                  process.stderr.write('stderr-ok\n')
                  if (mode === 'normal') process.exitCode = 1
                  else setInterval(() => {}, 1000)
                })
              }
              const targetFile = join(config.directory, 'target.mjs')
              await writeFile(targetFile, '(' + target.toString() + ')()', { flag: 'wx', mode: 0o600 })
              for (const mode of ['normal', 'cancel']) {
                phase = mode + '-ready'
                const handle = ctx.subprocess.spawn({
                  argv: [process.execPath, targetFile, mode], cwd: config.directory,
                  stdio: { stdin: 'pipe', stdout: 'pipe', stderr: 'pipe' }, graceMs: 100,
                })
                handles.push(handle)
                // Attach rejection handling before observing any readiness or stream state.
                const outcome = handle.done.then(value => ({ value }), error => {
                  report.primaryError ??= describeFailure(error)
                  return { failed: true }
                })
                let output = '', errors = '', streamFailed = false
                for (const [stream, append] of [[handle.stdout, value => { output += value }],
                  [handle.stderr, value => { errors += value }]]) {
                  assert(stream, 'Missing target stream')
                  stream.setEncoding('utf8')
                  stream.on('data', value => {
                    if (output.length + errors.length + value.length > 4096) streamFailed = true
                    else append(value)
                  })
                  stream.on('error', error => { report.primaryError ??= describeFailure(error); streamFailed = true })
                }
                await until(() => output.includes('\n') || streamFailed)
                assert(!streamFailed)
                const identity = JSON.parse(output.slice(0, output.indexOf('\n')))
                for (const pid of [identity.pid, identity.parent]) {
                  assert(Number.isSafeInteger(pid) && pid > 0)
                  if (pid !== process.pid) owned.add(pid)
                }
                assert.equal(await realpath(identity.executable), config.executable)
                assert.equal(identity.electron, config.electron)
                // The only fallback in this pinned provider spawns directly from this host.
                assert.notEqual(identity.parent, process.pid, 'Provider selected direct-spawn fallback, not Windows Job runner')
                assert(!gone(identity.pid) && !gone(identity.parent), 'Owned target or runner disappeared before input')
                phase = mode + '-stdio'
                assert(handle.stdin)
                handle.stdin.on('error', error => { report.primaryError ??= describeFailure(error); streamFailed = true })
                handle.stdin.end('stdin-ok\n')
                await until(() => (output.endsWith('\nstdin-ok\n') && errors === 'stderr-ok\n') || streamFailed)
                assert(!streamFailed)
                phase = mode + '-exit'
                if (mode === 'cancel') handle.terminate()
                assert.deepEqual(await bounded(outcome), { value: { exitCode: 1, signal: null } })
                assert.equal(await bounded(handle.waitForExit()), true)
                await until(() => gone(identity.pid) && gone(identity.parent))
              }
              phase = 'complete'
              report.primaryOk = report.primaryError === null
            } catch (error) {
              report.primaryError ??= describeFailure(error)
              report.primaryOk = false
            } finally {
              report.phase = phase
              try {
                for (const handle of handles) handle.terminate()
                const exits = await bounded(Promise.all(handles.map(handle => handle.waitForExit())))
                assert(exits.every(value => value === true))
                if (fiber) await bounded(fiber.dispose())
                await until(() => [...owned].every(gone))
                report.cleanupOk = true
              } catch (error) {
                report.cleanupError ??= describeFailure(error)
                report.cleanupOk = false
              }
              report.owned = [...owned]
              await writeFile(config.report, JSON.stringify(report), { flag: 'wx', mode: 0o600 })
            }
            if (!report.primaryOk || !report.cleanupOk) process.exitCode = 1
          }

          const before = await fingerprint()
          try {
            await verifyFlockEntry(resolve('packages/session/session-persistence-jsonl/package.json'), resolve('.'))
            await verifyFlockEntry(join(unpacked, 'node_modules/@deepseek-ai/dsh-session-persistence-jsonl/package.json'), unpacked)
            // Execute the actual emitted Windows lease primitive, not a second semaphore implementation.
            const { acquireLockHandleWin32, releaseLockHandleWin32 } = await import(pathToFileURL(
              resolve('packages/session/session-persistence-jsonl/lib/types/win32.js'),
            ).href)
            const directory = await mkdtemp(join(process.env.RUNNER_TEMP, 'dsh-host-system-'))
            let handle
            try {
              const lockPath = join(directory, 'session.lock')
              handle = await acquireLockHandleWin32(lockPath)
              await assert.rejects(async () => {
                const unexpected = await acquireLockHandleWin32(lockPath)
                await releaseLockHandleWin32(unexpected)
              }, { code: 'EBUSY' })
              await releaseLockHandleWin32(handle)
              handle = undefined
              handle = await acquireLockHandleWin32(lockPath)
              assert.deepEqual(await readdir(directory), [], 'Windows semaphore created a lock file')
            } finally {
              try { if (handle !== undefined) await releaseLockHandleWin32(handle) }
              finally { await rm(directory, { recursive: true, force: true }) }
            }
            const jobDirectory = await mkdtemp(join(process.env.RUNNER_TEMP, 'dsh-embedded-job-'))
            let cleanupConfirmed = false
            let accepted = false
            try {
              const executable = await realpath(join(release, 'win-unpacked', 'DeepSeek Harness.exe'))
              const electron = JSON.parse(await readFile('apps/desktop/package.json', 'utf8')).devDependencies.electron
              const reportPath = join(jobDirectory, 'result.json')
              const config = { executable, electron, unpacked, directory: jobDirectory, report: reportPath }
              const script = join(jobDirectory, 'probe.mjs')
              await writeFile(script, describeFailure.toString() + '\n(' + verifyEmbeddedWindowsJob.toString() + ')('
                + JSON.stringify(config) + ', describeFailure).catch(error => { '
                + 'process.stderr.write(JSON.stringify(describeFailure(error)) + "\\n"); process.exitCode = 1 })',
              { flag: 'wx', mode: 0o600 })
              const env = { ELECTRON_RUN_AS_NODE: '1', TEMP: jobDirectory, TMP: jobDirectory,
                HOME: jobDirectory, USERPROFILE: jobDirectory, APPDATA: jobDirectory, LOCALAPPDATA: jobDirectory }
              for (const name of ['SystemRoot', 'WINDIR']) if (process.env[name]) env[name] = process.env[name]
              const result = spawnSync(executable, ['--expose-internals', script], {
                cwd: jobDirectory, env, stdio: ['ignore', 'pipe', 'pipe'], timeout: 60000, maxBuffer: 16384,
              })
              const processFailure = result.error ?? (result.status !== 0 || result.signal !== null
                ? new Error('Packaged Electron exited with status=' + result.status + ', signal=' + result.signal) : undefined)
              const processResult = { status: result.status, signal: result.signal, error: describeFailure(result.error),
                stderr: (result.stderr ?? Buffer.alloc(0)).subarray(0, 4096).toString('utf8'),
                stderrTruncated: (result.stderr?.length ?? 0) > 4096 }
              function publicFailure(error) {
                const details = describeFailure(error)
                if (!details) return null
                let message = details.message
                for (const root of [jobDirectory, unpacked, release, resolve('.')]) {
                  message = message.replaceAll(root, '[path]').replaceAll(JSON.stringify(root).slice(1, -1), '[path]')
                }
                return { name: details.name, code: details.code, message: message.slice(0, 160) }
              }
              console.log('DSH_EMBEDDED_PROCESS ' + JSON.stringify({ status: processResult.status,
                signal: processResult.signal, error: publicFailure(describeFailure(processFailure)),
                stderrPreview: publicFailure(describeFailure(new Error(processResult.stderr)))?.message,
                stderrTruncated: processResult.stderrTruncated }))
              // Persist the original spawn outcome before a missing report can raise ENOENT.
              await writeFile(join(jobDirectory, 'process-result.json'), JSON.stringify(processResult), { flag: 'wx', mode: 0o600 })
              let bytes
              try { bytes = await readFile(reportPath) }
              catch (error) {
                await writeFile(join(jobDirectory, 'report-read-error.json'), JSON.stringify(describeFailure(error)),
                  { flag: 'wx', mode: 0o600 })
                console.log('DSH_EMBEDDED_JOB ' + JSON.stringify({ phase: 'report-read', cleanupConfirmed: false,
                  remainingObservedProcesses: null, processError: publicFailure(describeFailure(processFailure)),
                  reportError: publicFailure(describeFailure(error)) }))
                throw new AggregateError(processFailure ? [processFailure, error] : [error],
                  'Embedded Job report unavailable; original process outcome preserved', { cause: processFailure ?? error })
              }
              assert(bytes.length <= 8192, 'Embedded Job report exceeded its bound')
              const report = JSON.parse(bytes.toString('utf8'))
              assert.equal(report.schemaVersion, 1)
              assert(['runtime', 'bindings', 'normal-ready', 'normal-stdio', 'normal-exit',
                'cancel-ready', 'cancel-stdio', 'cancel-exit', 'complete'].includes(report.phase))
              console.log('DSH_EMBEDDED_REPORT ' + JSON.stringify({ phase: report.phase,
                primaryError: publicFailure(report.primaryError), cleanupError: publicFailure(report.cleanupError) }))
              assert(Array.isArray(report.owned) && report.owned.length <= 4)
              for (const pid of report.owned) {
                assert(Number.isSafeInteger(pid) && pid > 0 && pid !== process.pid)
                assert.throws(() => process.kill(pid, 0), { code: 'ESRCH' })
              }
              cleanupConfirmed = report.cleanupOk === true && result.signal === null && !result.error
              console.log('DSH_EMBEDDED_JOB ' + JSON.stringify({ phase: report.phase,
                primaryOk: report.primaryOk === true, cleanupConfirmed, observedProcesses: report.owned.length,
                primaryError: publicFailure(report.primaryError), cleanupError: publicFailure(report.cleanupError),
                remainingObservedProcesses: 0 }))
              assert(cleanupConfirmed, 'Embedded Job cleanup was not confirmed')
              assert.equal(result.status, 0, 'Packaged Electron Job smoke failed')
              assert.equal(report.primaryOk, true, 'Packaged Electron Job observations failed')
              accepted = true
              console.log('Packaged Electron Windows Job runner: normal exit, stdio, cancellation and owned zero passed')
            } finally {
              // Keep uncertain private diagnostics for the failed job; never claim forced exit as native success.
              if (cleanupConfirmed && accepted) await rm(jobDirectory, { recursive: true, force: true })
            }
          } finally {
            assert.deepEqual(await fingerprint(), before, 'Packaged bytes changed during system-path validation')
          }
          console.log('Windows system entry and semaphore exclusion/reacquisition passed; packaged bytes unchanged')
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Windows system-path validation failed.' }

      # Internal candidate only: preserving build evidence does not pass native
      # acceptance or authorize release. Keep one upload even if lifecycle fails.
      - name: Record SHA-256
        shell: pwsh
        run: |
          $artifact = 'apps/desktop/release/${{ steps.desktop.outputs.artifact }}'
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $file = Get-Item -LiteralPath $artifact
          $record = Get-Content -LiteralPath 'apps/desktop/release/desktop-package-setup.json' -Raw | ConvertFrom-Json
          if ($record.path -cne $file.Name -or $record.bytes -ne $file.Length -or $record.sha256 -cne $hash) {
            throw 'Setup candidate no longer matches its build evidence.'
          }
          $checksum = "$hash  $(Split-Path -Leaf $artifact)`n"
          [System.IO.File]::WriteAllText("$artifact.sha256", $checksum, [System.Text.Encoding]::ASCII)

      - name: Preserve unaccepted internal Setup candidate
        uses: actions/upload-artifact@v7
        with:
          name: DeepSeek-Harness-Setup-win-x64-${{ steps.desktop.outputs.version }}-${{ steps.source.outputs.sha }}
          path: |
            s/apps/desktop/release/${{ steps.desktop.outputs.artifact }}
            s/apps/desktop/release/${{ steps.desktop.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Measure the pinned public 0.5.3 baseline on this runner
        shell: pwsh
        run: |
          $baselineName = 'DeepSeek-Harness-Setup-0.5.3-win-x64.exe'
          $baselinePath = Join-Path $env:RUNNER_TEMP $baselineName
          $baselineUrl = "https://github.com/Missher12/deepseek-harness-desktop/releases/download/desktop-v0.5.3/$baselineName"
          Invoke-WebRequest -Uri $baselineUrl -OutFile $baselinePath
          $baseline = Get-Item -LiteralPath $baselinePath
          if ($baseline.Length -ne 152982782) {
            throw "0.5.3 Setup size mismatch: expected 152982782, got $($baseline.Length)."
          }
          $baselineHash = (Get-FileHash -LiteralPath $baselinePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = 'adb72bcbdc40ee87b37b7eb5867b75f66110cbb50ad91ad55e6f1a910191ca87'
          if ($baselineHash -ne $expectedHash) {
            throw "0.5.3 Setup SHA-256 mismatch: expected $expectedHash, got $baselineHash."
          }
          $baselineSetupEvidence = [ordered]@{
            schemaVersion = 1
            path = $baseline.Name
            bytes = $baseline.Length
            sha256 = $baselineHash
          }
          [System.IO.File]::WriteAllText(
            'apps/desktop/release/desktop-package-setup-baseline-0.5.3.json',
            (($baselineSetupEvidence | ConvertTo-Json) + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
          ./scripts/windows-desktop-setup-smoke.ps1 `
            -SetupPath $baselinePath `
            -StartupSummaryPath apps/desktop/release/desktop-startup-baseline-0.5.3.json `
            -PackageInventoryPath apps/desktop/release/desktop-package-installed-baseline-0.5.3.json `
            -InstallationEvidencePath apps/desktop/release/desktop-windows-install-evidence-baseline-0.5.3.json `
            -RuntimeEvidenceOnly `
            -HistoricalBaselineInventory
          Remove-Item -LiteralPath $baselinePath -Force

      - name: Prove the released 0.5.6 blank-details regression
        shell: pwsh
        run: |
          $baselinePath = Join-Path $env:RUNNER_TEMP 'DeepSeek-Harness-Setup-0.5.6-win-x64.exe'
          if (-not (Test-Path -LiteralPath $baselinePath)) {
            Invoke-WebRequest -Uri 'https://github.com/Missher12/deepseek-harness-desktop/releases/download/desktop-v0.5.6/DeepSeek-Harness-Setup-0.5.6-win-x64.exe' -OutFile $baselinePath
          }
          $baseline = Get-Item -LiteralPath $baselinePath
          $hash = (Get-FileHash -LiteralPath $baselinePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseline.Length -ne 146634670 -or $hash -ne '622afd88789070e7137533d1cadad5c9c26784b7ec69c0fc87b1af4d79be8744') {
            throw 'The released installer regression baseline does not match its fixed bytes.'
          }
          ./scripts/windows-desktop-installer-ui-smoke.ps1 `
            -SetupPath $baselinePath `
            -EvidenceRoot apps/desktop/release/windows-installer-ui-baseline-0.5.6 `
            -ExpectBlankDetails

      - name: Exercise the visible installer pages
        shell: pwsh
        run: >-
          ./scripts/windows-desktop-installer-ui-smoke.ps1
          -SetupPath apps/desktop/release/${{ steps.desktop.outputs.artifact }}
          -EvidenceRoot apps/desktop/release/windows-installer-ui-evidence

      - name: Install and exercise the packaged application lifecycle
        shell: pwsh
        run: >-
          ./scripts/windows-desktop-setup-smoke.ps1
          -SetupPath apps/desktop/release/${{ steps.desktop.outputs.artifact }}
          -StartupSummaryPath apps/desktop/release/desktop-startup-summary.json
          -PackageInventoryPath apps/desktop/release/desktop-package-installed.json
          -InstallationEvidencePath apps/desktop/release/desktop-windows-install-evidence.json
          -VisualEvidenceRoot apps/desktop/release/windows-native-visual-evidence
          -PackagePolicy windows-x64
          -PackageManifestPath apps/desktop/package.json

      - name: Verify portable Session workspace receipt
        shell: pwsh
        run: |
          @'
          import { verifySessionWorkspaceReceipt } from './scripts/desktop-session-workspace-receipt.ts'
          await verifySessionWorkspaceReceipt('apps/desktop/release/desktop-smoke-session-workspaces-win32.json')
          console.log('Portable Session workspace receipt verified: two directories, five writes, preserved V2 and reopened V3')
          '@ | node --import tsx/esm --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Session workspace receipt validation failed.' }

      - name: Preserve portable runtime evidence
        uses: actions/upload-artifact@v7
        with:
          name: Windows-runtime-evidence-${{ steps.source.outputs.sha }}
          path: |
            s/apps/desktop/release/desktop-startup-summary.json
            s/apps/desktop/release/desktop-package-installed.json
            s/apps/desktop/release/desktop-windows-install-evidence.json
            s/apps/desktop/release/desktop-package-staged.json
            s/apps/desktop/release/desktop-package-setup.json
            s/apps/desktop/release/desktop-startup-baseline-0.5.3.json
            s/apps/desktop/release/desktop-package-installed-baseline-0.5.3.json
            s/apps/desktop/release/desktop-windows-install-evidence-baseline-0.5.3.json
            s/apps/desktop/release/desktop-package-setup-baseline-0.5.3.json
            s/apps/desktop/release/windows-installer-ui-evidence/installer-progress.json
            s/apps/desktop/release/windows-installer-ui-baseline-0.5.6/installer-progress.json
            s/apps/desktop/release/windows-update-handoff-evidence/handoff.json
            s/apps/desktop/release/desktop-smoke-session-workspaces-win32.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve native title-bar diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Windows-titlebar-diagnostics-${{ steps.source.outputs.sha }}
          path: |
            s/apps/desktop/release/desktop-smoke-titlebar-win32.json
            s/apps/desktop/release/desktop-smoke-titlebar-win32.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve bounded native visual evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Windows-native-visual-evidence-${{ steps.source.outputs.sha }}
          path: |
            s/apps/desktop/release/windows-installer-ui-evidence/*.png
            s/apps/desktop/release/windows-installer-ui-baseline-0.5.6/*.png
            s/apps/desktop/release/windows-installer-ui-evidence/installer-progress.json
            s/apps/desktop/release/windows-installer-ui-baseline-0.5.6/installer-progress.json
            s/apps/desktop/release/windows-native-visual-evidence/*.png
            s/apps/desktop/release/windows-native-visual-evidence/*.json
            s/apps/desktop/release/windows-update-handoff-evidence/handoff-welcome.png
            s/apps/desktop/release/desktop-smoke-win32.png
            s/apps/desktop/release/desktop-smoke-first-run-win32.png
            s/apps/desktop/release/desktop-smoke-first-run-win32.json
            s/apps/desktop/release/desktop-smoke-messenger-win32.png
            s/apps/desktop/release/desktop-smoke-workbench-win32.png
            s/apps/desktop/release/desktop-smoke-reasoning-win32.png
            s/apps/desktop/release/desktop-smoke-reader-*-win32.png
            s/apps/desktop/release/desktop-smoke-usage-win32.png
            s/apps/desktop/release/desktop-smoke-personalization-win32.png
            s/apps/desktop/release/desktop-smoke-memory-win32.png
            s/apps/desktop/release/desktop-smoke-market-win32.png
            s/apps/desktop/release/desktop-smoke-system-update-win32.png
            s/apps/desktop/release/desktop-smoke-dpi-150-win32.png
            s/apps/desktop/release/desktop-smoke-dpi-150-win32.json
          if-no-files-found: ignore
          retention-days: 14
