name: Windows Desktop Setup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-search-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  search-diagnostic:
    name: inspect Search accessibility without rebuilding
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download and verify the published baseline installer
        shell: pwsh
        run: |
          $base = 'https://github.com/Missher12/deepseek-harness-desktop/releases/download/desktop-v0.5.3'
          $name = 'DeepSeek-Harness-Setup-0.5.3-win-x64.exe'
          $setup = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri "$base/$name" -OutFile $setup
          Invoke-WebRequest -Uri "$base/$name.sha256" -OutFile "$setup.sha256"
          $sidecar = [System.IO.File]::ReadAllText("$setup.sha256").Trim()
          if ($sidecar -notmatch '^([0-9a-fA-F]{64})\s+\*?DeepSeek-Harness-Setup-0\.5\.3-win-x64\.exe$') { throw 'Invalid baseline checksum sidecar' }
          $expected = $Matches[1].ToLowerInvariant()
          if ((Get-Item $setup).Length -ne 152982782) { throw 'Unexpected baseline installer size' }
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Baseline checksum mismatch' }
          "BASELINE_SHA256=$expected" >> $env:GITHUB_ENV
      - name: Observe the isolated baseline Search controls
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeVisualInput {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] private static extern void keybd_event(byte key, byte scan, uint flags, UIntPtr extra);
            public static void Key(byte key) { keybd_event(key,0,0,UIntPtr.Zero); keybd_event(key,0,2,UIntPtr.Zero); }
          }
          '@
          $setup = Join-Path $env:RUNNER_TEMP 'DeepSeek-Harness-Setup-0.5.3-win-x64.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP ('dsh-search-' + [guid]::NewGuid().ToString('N'))
          $output = Join-Path $env:RUNNER_TEMP 'search-diagnostic.json'
          function Safe-Name([string]$value) {
            if ($value -notmatch '(?i)DeepSeek Harness|^App$|^Open$|^Best match$|^Search') { return '[other]' }
            return ($value -replace '(?i)(?:[A-Z]:\\|https?://)\S+', '[redacted]').Substring(0, [Math]::Min(160, ($value -replace '(?i)(?:[A-Z]:\\|https?://)\S+', '[redacted]').Length))
          }
          function Read-Control($element) {
            $current = $element.Current
            $valuePattern = $null
            $textPattern = $null
            $hasValue = $element.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern, [ref]$valuePattern)
            $hasText = $element.TryGetCurrentPattern([System.Windows.Automation.TextPattern]::Pattern, [ref]$textPattern)
            return [ordered]@{
              name = Safe-Name $current.Name
              type = $current.ControlType.ProgrammaticName
              enabled = $current.IsEnabled
              offscreen = $current.IsOffscreen
              id = ($element.GetRuntimeId() -join '.')
              bounds = @($current.BoundingRectangle.X, $current.BoundingRectangle.Y, $current.BoundingRectangle.Width, $current.BoundingRectangle.Height)
              patterns = @($element.GetSupportedPatterns() | ForEach-Object { $_.ProgrammaticName })
              valueEqualsQuery = ($hasValue -and $valuePattern.Current.Value -ceq 'DeepSeek Harness')
              textEqualsQuery = ($hasText -and $textPattern.DocumentRange.GetText(256).Trim() -ceq 'DeepSeek Harness')
            }
          }
          $samples = @()
          $oldPredicatePassed = $null
          $diagnosticError = $null
          $installer = $null
          try {
            $start = [System.Diagnostics.ProcessStartInfo]::new($setup)
            $start.UseShellExecute = $false
            $start.Arguments = "/S /D=$installRoot"
            $installer = [System.Diagnostics.Process]::Start($start)
            if (-not $installer.WaitForExit(120000)) { $installer.Kill($true); throw 'Baseline installation timed out' }
            if ($installer.ExitCode -ne 0) { throw 'Baseline installation failed' }
            $installer.Dispose()
            $installer = $null
            [NativeVisualInput]::Key(0x5B)
            Start-Sleep -Milliseconds 500
            [System.Windows.Forms.SendKeys]::SendWait('DeepSeek Harness')
            foreach ($sample in 1..3) {
              Start-Sleep -Seconds 2
              $foreground = [NativeVisualInput]::GetForegroundWindow()
              $root = [System.Windows.Automation.AutomationElement]::FromHandle($foreground)
              $processName = (Get-Process -Id $root.Current.ProcessId).ProcessName
              if ($processName -notin @('SearchHost','SearchApp','SearchUI','StartMenuExperienceHost')) {
                $samples += [ordered]@{ sample = $sample; processName = $processName; reason = 'unexpected foreground'; controls = @() }
                continue
              }
              $rows = @()
              $elements = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
              if ($elements.Count -gt 500) { throw 'Search tree exceeds diagnostic bound' }
              foreach ($element in $elements) {
                if ($element.Current.Name -notmatch '(?i)DeepSeek Harness|^App$|^Open$' -and $element.Current.ControlType -ne [System.Windows.Automation.ControlType]::Edit) { continue }
                $parents = @()
                $parent = $element
                foreach ($depth in 1..5) {
                  $parent = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($parent)
                  if ($null -eq $parent -or $parent.Current.ProcessId -ne $root.Current.ProcessId) { break }
                  $parents += Read-Control $parent
                }
                $rows += [ordered]@{ control = Read-Control $element; parents = $parents }
              }
              $samples += [ordered]@{ sample = $sample; processName = $processName; root = Read-Control $root; controls = $rows; foregroundUnchanged = ([NativeVisualInput]::GetForegroundWindow() -eq $foreground) }
            }
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'scripts/windows-desktop-native-visual-smoke.ps1'), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw 'Native smoke parse failed' }
            $definitions = $ast.FindAll({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -in @('Test-SearchProcessName','Test-SearchApplicationObservation','Wait-SearchApplicationResult') }, $true)
            foreach ($definition in $definitions) { Invoke-Expression $definition.Extent.Text }
            $oldPredicatePassed = $false
            try { [void](Wait-SearchApplicationResult -TimeoutSeconds 2); $oldPredicatePassed = $true } catch { if ($_.Exception.Message -notlike 'Windows Search did not expose*') { throw } }
          } catch {
            $diagnosticError = $_.Exception.GetType().Name
            throw
          } finally {
            if ($null -ne $installer) { $installer.Dispose() }
            try {
              $evidence = [ordered]@{ sourceRevision = '${{ github.sha }}'; diagnosticOnly = $true; baselineVersion = '0.5.3'; baselineSha256 = $env:BASELINE_SHA256; oldPredicatePassed = $oldPredicatePassed; diagnosticError = $diagnosticError; samples = $samples }
              $json = $evidence | ConvertTo-Json -Depth 12
              if ([System.Text.Encoding]::UTF8.GetByteCount($json) -gt 96000) { throw 'Diagnostic JSON exceeds size bound' }
              [System.IO.File]::WriteAllText($output, $json, [System.Text.UTF8Encoding]::new($false))
            } catch { Write-Warning 'Could not persist bounded Search evidence.' }
            [NativeVisualInput]::Key(0x1B)
            $uninstaller = Join-Path $installRoot 'Uninstall DeepSeek Harness.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $launcher = Join-Path $env:RUNNER_TEMP ('dsh-search-uninstall-' + [guid]::NewGuid().ToString('N') + '.exe')
              Copy-Item -LiteralPath $uninstaller -Destination $launcher
              $cleanup = Start-Process -FilePath $launcher -ArgumentList @('/S', "_?=$installRoot") -PassThru
              if (-not $cleanup.WaitForExit(60000)) { $cleanup.Kill($true); throw 'Baseline uninstall timed out' }
              if ($cleanup.ExitCode -ne 0) { throw 'Baseline uninstall failed' }
              $cleanup.Dispose()
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Windows-Search-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/search-diagnostic.json
          if-no-files-found: error
          retention-days: 3
