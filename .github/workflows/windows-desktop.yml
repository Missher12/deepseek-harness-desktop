name: Windows Desktop Setup

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-install-smoke:
    name: build, install, launch, and uninstall
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: s
    steps:
      - uses: actions/checkout@v6
        with:
          path: s
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        id: source
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "source revision mismatch: expected $expected, got $actual"
          }
          "sha=$actual" >> $env:GITHUB_OUTPUT

      - name: Enable Developer Mode for workspace symlinks
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install immutable dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Resolve Desktop release metadata
        id: desktop
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'apps/desktop/package.json' -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Desktop package version must be major.minor.patch, got: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=DeepSeek-Harness-Setup-$version-win-x64.exe" >> $env:GITHUB_OUTPUT

      - name: Build the assisted Windows Setup
        shell: pwsh
        run: |
          $env:DSH_DESKTOP_STAGE_DIR = Join-Path $env:RUNNER_TEMP 'dsh-desktop-stage'
          pnpm run desktop:stage
          pnpm --filter @deepseek-ai/dsh-desktop exec electron-builder --projectDir "$env:DSH_DESKTOP_STAGE_DIR" --config "$env:DSH_DESKTOP_STAGE_DIR\electron-builder.yml" --win nsis --x64
          $artifact = '${{ steps.desktop.outputs.artifact }}'
          $builtArtifact = Join-Path (Split-Path -Parent $env:DSH_DESKTOP_STAGE_DIR) "release\$artifact"
          $workspaceArtifact = Join-Path 'apps/desktop/release' $artifact
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $workspaceArtifact) | Out-Null
          Copy-Item -LiteralPath $builtArtifact -Destination $workspaceArtifact

      - name: Exercise the visible installer pages
        shell: pwsh
        run: >-
          ./scripts/windows-desktop-installer-ui-smoke.ps1
          -SetupPath apps/desktop/release/${{ steps.desktop.outputs.artifact }}

      - name: Install and exercise the packaged application lifecycle
        shell: pwsh
        run: >-
          ./scripts/windows-desktop-setup-smoke.ps1
          -SetupPath apps/desktop/release/${{ steps.desktop.outputs.artifact }}

      - name: Preserve native title-bar diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Windows-titlebar-diagnostics-${{ steps.source.outputs.sha }}
          path: |
            s/apps/desktop/release/desktop-smoke-titlebar-win32.json
            s/apps/desktop/release/desktop-smoke-titlebar-win32.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Record SHA-256
        shell: pwsh
        run: |
          $artifact = 'apps/desktop/release/${{ steps.desktop.outputs.artifact }}'
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$hash  $(Split-Path -Leaf $artifact)`n"
          [System.IO.File]::WriteAllText("$artifact.sha256", $checksum, [System.Text.Encoding]::ASCII)

      - uses: actions/upload-artifact@v7
        with:
          name: DeepSeek-Harness-Setup-win-x64-${{ steps.desktop.outputs.version }}-${{ steps.source.outputs.sha }}
          path: |
            s/apps/desktop/release/${{ steps.desktop.outputs.artifact }}
            s/apps/desktop/release/${{ steps.desktop.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 14
