name: Windows native parser timing diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-timing:
    runs-on: windows-2025
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
        working-directory: s
    steps:
      - uses: actions/checkout@v6
        with:
          path: s
          persist-credentials: false
          fetch-depth: 8
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check exact source and the bounded decoder without running native payloads
        run: |
          if ((git rev-parse HEAD).Trim() -cne '${{ github.sha }}') { throw 'Diagnostic source mismatch.' }
          $base = '20a141d9ba823c7a1b114bc2b751af5d163efced'
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic base mismatch.' }
          $expected = @('.github/workflows/windows-desktop.yml', 'scripts/windows-update-parser-timing.mjs')
          $actual = @(git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0 -or (Compare-Object ($expected | Sort-Object) ($actual | Sort-Object))) { throw 'Diagnostic file scope mismatch.' }
          node --experimental-transform-types scripts/windows-update-parser-timing.mjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned producer/spec or timing decoder check failed.' }
      - name: Measure only two native parser invocations within 30 seconds
        run: |
          $lifetime = [Diagnostics.Stopwatch]::StartNew()
          $rootPreparation = [Diagnostics.Stopwatch]::StartNew()
          $nativeTemp = (node -p 'require("node:os").tmpdir()').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate native temporary directory.' }
          $parserRoot = Join-Path $nativeTemp ('dsh-parser-timing-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $parserRoot | Out-Null
          $rootPreparation.Stop()
          $env:DSH_PARSER_TIMING_ROOT = $parserRoot
          $entry = $null
          $deadlineHit = $false
          $entryExited = $null
          $entryExitCode = $null
          $scopeRemoved = $false
          $failureType = $null
          $nativeErrorCode = $null
          $nodeExists = $null
          $directoryExists = $null
          try {
            $resolvedNode = @(node -p 'process.execPath')
            if ($LASTEXITCODE -ne 0 -or $resolvedNode.Count -ne 1) { throw 'Running Node did not return one executable.' }
            $nodePath = $resolvedNode[0].Trim()
            $repositoryDirectory = (Resolve-Path -LiteralPath '.').Path
            $nodeExists = Test-Path -LiteralPath $nodePath -PathType Leaf
            $directoryExists = Test-Path -LiteralPath $repositoryDirectory -PathType Container
            if (-not $nodeExists -or -not $directoryExists) { throw 'Diagnostic executable or working directory is missing.' }
            $info = [Diagnostics.ProcessStartInfo]::new($nodePath)
            $info.UseShellExecute = $false
            $info.WorkingDirectory = $repositoryDirectory
            $info.Arguments = '--experimental-transform-types scripts/windows-update-parser-timing.mjs'
            $entry = [Diagnostics.Process]::Start($info)
            if ($null -eq $entry) { throw 'Timing entry did not start.' }
            $remaining = [Math]::Max(0, 30000 - $lifetime.ElapsedMilliseconds)
            if (-not $entry.WaitForExit([int]$remaining)) { $deadlineHit = $true; throw 'Independent diagnostic deadline reached.' }
            $entryExitCode = $entry.ExitCode
            if ($entryExitCode -ne 0) { throw 'Native parser measurements or assertions failed.' }
          } catch {
            $failure = $_.Exception.GetBaseException()
            $failureType = $failure.GetType().Name
            if ($failure -is [System.ComponentModel.Win32Exception]) { $nativeErrorCode = $failure.NativeErrorCode }
          }
          finally {
            try {
              if ($null -ne $entry) {
                if (-not $entry.HasExited) { $entry.Kill($true); [void]$entry.WaitForExit(5000) }
                $entryExited = $entry.HasExited
              }
              Remove-Item -LiteralPath $parserRoot -Recurse -Force
              $scopeRemoved = -not (Test-Path -LiteralPath $parserRoot)
            } catch { if ($null -eq $failureType) { $failureType = $_.Exception.GetBaseException().GetType().Name } }
            finally { if ($null -ne $entry) { $entry.Dispose() } }
            $lifetime.Stop()
            if ($lifetime.ElapsedMilliseconds -ge 30000) { $deadlineHit = $true; if ($null -eq $failureType) { $failureType = 'DiagnosticBudgetExceeded' } }
            $reportDirectory = 'apps/desktop/release'
            New-Item -ItemType Directory -Force -Path $reportDirectory | Out-Null
            [IO.File]::WriteAllText((Join-Path $reportDirectory 'windows-parser-watchdog.json'), (([ordered]@{
              schemaVersion = 1; productSourceSha = '2106cb68aa5b467dc3a7dc3a225027af08142222'; diagnosticSourceSha = '${{ github.sha }}'
              budgetMs = 30000; rootPreparationMs = $rootPreparation.Elapsed.TotalMilliseconds; lifetimeIncludingCleanupMs = $lifetime.Elapsed.TotalMilliseconds
              deadlineHit = $deadlineHit; entryExited = $entryExited; entryExitCode = $entryExitCode; scopeRemoved = $scopeRemoved; failureType = $failureType
              executableExists = $nodeExists; workingDirectoryExists = $directoryExists; nativeErrorCode = $nativeErrorCode
              parserChildExitProof = 'individual exits are recorded only in windows-parser-timing.json; watchdog termination alone is not proof'
            } | ConvertTo-Json) + "`n"), [Text.UTF8Encoding]::new($false))
          }
          if ($null -ne $failureType -or $entryExited -ne $true -or -not $scopeRemoved) { throw 'Parser diagnostic failed; inspect bounded timing/watchdog receipts. Do not retry.' }
      - name: Preserve only parser measurements and cleanup outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-parser-timing-${{ github.run_id }}
          path: |
            s/apps/desktop/release/windows-parser-timing.json
            s/apps/desktop/release/windows-parser-watchdog.json
          if-no-files-found: warn
          retention-days: 7
