name: Windows Desktop Setup
run-name: Windows cancel handle diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel-handle-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Observe owned short-lived process exit with and without a retained handle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-FixedExceptionType($Exception) {
            while ($null -ne $Exception.InnerException) { $Exception = $Exception.InnerException }
            $name = $Exception.GetType().Name
            if ($name -in @('ArgumentException', 'InvalidOperationException', 'Win32Exception', 'TimeoutException')) { return $name }
            return 'Other'
          }
          $self = [Diagnostics.Process]::GetCurrentProcess()
          try { $executable = $self.MainModule.FileName } finally { $self.Dispose() }
          $failed = $false
          foreach ($iteration in @(1, 2)) {
            foreach ($retain in @($false, $true)) {
              $eventName = 'Local\dsh-exit-probe-' + [Guid]::NewGuid().ToString('N')
              $gate = [Threading.EventWaitHandle]::new($false, [Threading.EventResetMode]::ManualReset, $eventName)
              $observer = $null
              $childId = $null
              $created = $null
              $record = [ordered]@{
                iteration = $iteration; retained = $retain; phase = 'start'
                identityMatched = $false; exited = $false; hasExited = $null
                exitCode = $null; exception = 'None'; cleanup = 'pending'; remainingOwned = 0
              }
              try {
                # Only fixed .NET operations; the child exits normally with code 1.
                $childSource = "`$gate=[Threading.EventWaitHandle]::OpenExisting('$eventName'); try { [void]`$gate.WaitOne(5000) } finally { `$gate.Dispose() }; exit 1"
                $info = [Diagnostics.ProcessStartInfo]::new()
                $info.FileName = $executable
                $info.UseShellExecute = $false
                $info.CreateNoWindow = $true
                $info.RedirectStandardOutput = $true
                $info.RedirectStandardError = $true
                $info.Environment.Clear()
                foreach ($name in @('SystemRoot', 'WINDIR', 'TEMP', 'TMP')) {
                  $value = [Environment]::GetEnvironmentVariable($name)
                  if ($null -ne $value) { $info.Environment[$name] = $value }
                }
                foreach ($arg in @('-NoLogo', '-NoProfile', '-NonInteractive', '-EncodedCommand',
                    [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($childSource)))) {
                  [void]$info.ArgumentList.Add($arg)
                }
                $launcher = [Diagnostics.Process]::Start($info)
                try {
                  $childId = $launcher.Id
                  $created = $launcher.StartTime.ToUniversalTime().Ticks
                  $observer = [Diagnostics.Process]::GetProcessById($childId)
                  $record.phase = 'attach'
                  if ($retain) { [void]$observer.Handle }
                  $record.identityMatched = $observer.StartTime.ToUniversalTime().Ticks -eq $created -and
                    $observer.MainModule.FileName -ieq $executable
                  if (-not $record.identityMatched) { throw [InvalidOperationException]::new() }
                } finally { $launcher.Dispose() }
                # Dispose the launcher's handle before exit so it cannot mask the comparison.
                $record.phase = 'wait'
                [void]$gate.Set()
                $record.exited = $observer.WaitForExit(10000)
                if (-not $record.exited) { throw [TimeoutException]::new() }
                $record.phase = 'has-exited'
                $record.hasExited = $observer.HasExited
                $record.phase = 'exit-code'
                $record.exitCode = $observer.ExitCode
                $record.phase = 'complete'
              } catch { $record.exception = Get-FixedExceptionType $_.Exception }
              finally {
                [void]$gate.Set()
                if ($null -ne $observer) { $observer.Dispose() }
                $live = $null
                try {
                  if ($null -ne $childId) {
                    try { $live = [Diagnostics.Process]::GetProcessById($childId) }
                    catch [ArgumentException] { } # An absent child is already stopped.
                    if ($null -ne $live) {
                      [void]$live.Handle
                      if ($live.StartTime.ToUniversalTime().Ticks -ne $created -or $live.MainModule.FileName -ine $executable) {
                        throw [InvalidOperationException]::new()
                      }
                      if (-not $live.HasExited) {
                        $live.Kill()
                        $record.cleanup = 'forced'
                        if (-not $live.WaitForExit(5000)) { $record.remainingOwned = 1; throw [TimeoutException]::new() }
                      }
                    }
                  }
                  if ($record.cleanup -eq 'pending') { $record.cleanup = 'stopped' }
                } catch { $record.cleanup = 'unconfirmed'; $record.remainingOwned = 1 }
                finally { if ($null -ne $live) { $live.Dispose() }; $gate.Dispose() }
              }
              [Console]::Out.WriteLine('DSH_HANDLE_PROBE ' + ($record | ConvertTo-Json -Compress))
              if ($record.cleanup -ne 'stopped' -or -not $record.identityMatched -or -not $record.exited -or
                  ($retain -and ($record.exception -ne 'None' -or $record.exitCode -ne 1))) { $failed = $true }
            }
          }
          if ($failed) { exit 1 }
