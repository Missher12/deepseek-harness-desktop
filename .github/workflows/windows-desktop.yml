name: Windows picker bounded diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DSH_PICKER_DIAGNOSTIC_SHA: ${{ github.sha }}

jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: s
    steps:
      - uses: actions/checkout@v6
        with:
          path: s
          persist-credentials: false
          fetch-depth: 16
      - name: Pin product source and parse the diagnostic before installation
        run: |
          $source = '5a17c6b29971b6034929bb8a13e3b11cdc4748e8'
          if ((git rev-parse HEAD).Trim() -cne $env:DSH_PICKER_DIAGNOSTIC_SHA) { throw 'Diagnostic source revision mismatch.' }
          git merge-base --is-ancestor $source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned product source is not in the bounded diagnostic ancestry.' }
          $allowed = @('.github/workflows/windows-desktop.yml', 'scripts/windows-picker-diagnostic-artifact.mjs', 'scripts/windows-picker-diagnostic-artifact.test.mjs', 'scripts/windows-picker-diagnostic-driver.mjs', 'scripts/windows-picker-diagnostic.ps1', 'scripts/windows-picker-diagnostic-run.ps1', 'scripts/windows-directory-picker-ui-smoke.ps1', 'scripts/windows-directory-picker-ui-smoke.spec.ts')
          $changed = @(git diff --name-only $source HEAD)
          if ($LASTEXITCODE -ne 0 -or (Compare-Object ($allowed | Sort-Object) ($changed | Sort-Object))) { throw 'Diagnostic source file allowlist mismatch.' }
          foreach ($file in @('scripts/windows-picker-diagnostic.ps1', 'scripts/windows-picker-diagnostic-run.ps1', 'scripts/windows-directory-picker-ui-smoke.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              foreach ($errorItem in $errors) { Write-Output ('{0}:{1}:{2}: {3}' -f (Split-Path $file -Leaf), $errorItem.Extent.StartLineNumber, $errorItem.Extent.StartColumnNumber, $errorItem.Message) }
              throw 'Diagnostic PowerShell parser failed.'
            }
          }
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Artifact identity tests
        run: node --test scripts/windows-picker-diagnostic-artifact.test.mjs
      - name: Download the already built internal Setup once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/windows-picker-diagnostic-artifact.mjs download "$env:RUNNER_TEMP/picker-candidate"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact download failed; no retry.' }
      - name: Prepare only the locked diagnostic test driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked diagnostic dependencies failed.' }
      - name: Test native picker guards and window relationships
        run: |
          pnpm exec vitest run scripts/windows-directory-picker-ui-smoke.spec.ts --config vitest.config.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native guard or WinForms ownership tests failed; do not start the picker.' }
      - name: Exercise native selection and the existing packaged tail
        run: ./scripts/windows-picker-diagnostic-run.ps1
      - name: Upload only bounded diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-picker-diagnostic-${{ github.run_id }}
          path: |
            s/apps/desktop/release/picker-diagnostic/artifact.json
            s/apps/desktop/release/picker-diagnostic/observation.json
            s/apps/desktop/release/picker-diagnostic/driver.json
            s/apps/desktop/release/picker-diagnostic/cleanup.json
            s/apps/desktop/release/picker-diagnostic/runner.json
            s/apps/desktop/release/picker-diagnostic/picker.json
            s/apps/desktop/release/picker-diagnostic/session-workspaces.json
          if-no-files-found: warn
          retention-days: 7
