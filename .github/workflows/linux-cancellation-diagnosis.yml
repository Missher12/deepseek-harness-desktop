name: Linux cancellation diagnosis

on:
  push:
    branches: [codex/desktop-0.5.10-linux-diagnosis]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Require the native Linux owner
        run: systemctl --user show --property=Version --value
      - name: Reproduce the three original cancellation cases
        run: >-
          timeout 180s pnpm exec vitest run
          packages/shell/bash-sandbox/tests/sandbox.spec.ts
          packages/shell/pwsh-local/tests/executor.spec.ts
          -t 'disposal kills wrapped background jobs|kill\(\) requests managed-range termination|a spec.signal abort settles'
          --reporter=verbose --testTimeout=30000
      - name: Verify Linux owners and native containment
        run: >-
          timeout 240s pnpm exec vitest run
          packages/subprocess/subprocess-local/tests/linux-scope.spec.ts
          packages/subprocess/subprocess-local/tests/native-containment.spec.ts
          packages/subprocess/subprocess-local/tests/local.spec.ts
          packages/subprocess/subprocess-local/tests/spawn.spec.ts
          packages/terminal/terminal-bash/tests/local.spec.ts
          --reporter=dot --testTimeout=30000
      - name: Inspect the owned leftover scopes and test explicit stop
        if: always()
        run: |
          mapfile -t units < <(systemctl --user list-units --type=scope --all --plain --no-legend 'dsh-subprocess-*' | awk '{print $1}')
          for unit in "${units[@]}"; do
            [[ "$unit" =~ ^dsh-subprocess-[0-9]+-[0-9a-f]+\.scope$ ]] || continue
            systemctl --user show "$unit" -p Id -p ActiveState -p SubState -p Result -p TasksCurrent -p ControlGroup
            group=$(systemctl --user show "$unit" -p ControlGroup --value)
            if [[ "$group" == /* && -r "/sys/fs/cgroup$group/cgroup.events" ]]; then
              cat "/sys/fs/cgroup$group/cgroup.events"
              cat "/sys/fs/cgroup$group/cgroup.procs"
            fi
            systemctl --user stop --no-block "$unit"
            for attempt in {1..20}; do
              state=$(systemctl --user show "$unit" -p ActiveState --value)
              printf 'after-stop unit=%s state=%s\n' "$unit" "$state"
              [[ "$state" == inactive || "$state" == failed ]] && break
              sleep 0.1
            done
          done
