# Immutable Desktop composition; user-installed plugins stay in the Web profile.
- insert:
    - id: desktop-plugin-runtime
      name: '@deepseek-ai/dsh-host-desktop-plugin-runtime'
      config:
        profile: web

    - id: reasoning-effort
      name: '@deepseek-ai/dsh-reasoning-effort'

    - id: session-messenger
      name: '@deepseek-ai/dsh-session-messenger'

    - id: dsh-market
      name: 'dshmarket'

    - id: desktop-system-update
      name: '@deepseek-ai/dsh-client-ui-settings-system-update'

# Desktop retains its full-width conversation and native file-opening flow.
- id: session-controller
  config:
    noProjectDirectory: deepseek-temp

- id: ui-sidebar-right
  disabled: true

- id: ui-sidebar-documentpreview
  disabled: true

- id: ui-sidebar-files
  disabled: true
