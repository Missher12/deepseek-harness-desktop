# Desktop-only plugin management. This immutable application resource is
# composed after the ordinary Web profile and is never written to ~/.dsh.
- id: missher-memory
  name: 'dsh-missher-memory'
  disabled: true

- id: missher-evolution
  name: 'dsh-missher-evolution'
  disabled: true

- insert:
    - id: desktop-plugin-runtime
      name: '@deepseek-ai/dsh-host-desktop-plugin-runtime'
      config:
        profile: web

    - id: reasoning-effort
      name: '@deepseek-ai/dsh-reasoning-effort'

    - id: session-messenger
      name: '@deepseek-ai/dsh-session-messenger'

    - id: desktop-workbench
      name: '@deepseek-ai/dsh-desktop-workbench'

    # One bounded arbitration and injection path for every local knowledge
    # provider. This row must precede memory and evolution registration.
    - id: missher-brain
      name: '@deepseek-ai/dsh-missher-brain'

    # Desktop-owned dual-face wrappers resolve these exact provider builds from
    # the app tree for both Host and Web. The legacy Profile rows above stay
    # intact but disabled, preventing duplicate ids and profile-local packages
    # from shadowing an app upgrade.
    - id: desktop-missher-memory
      name: '@deepseek-ai/dsh-desktop-managed-memory'
      config:
        enabled: true
        captureEnabled: true
        recallEnabled: true
        consolidationEnabled: true

    - id: desktop-missher-evolution
      name: '@deepseek-ai/dsh-desktop-managed-evolution'
      config:
        enabled: true
        maintenanceIntervalHours: 24
        maxInjectedRules: 4

    - id: dsh-market
      name: 'dshmarket'
      config:
        builtins:
          - name: '@deepseek-ai/dsh-missher-brain'
            spec: 'builtin:0.1.1-rc.2'
            owner: 'Missher12'
            url: 'https://github.com/Missher12/deepseek-harness-desktop'
            category: 'memory'
            description:
              zh: '记忆与学习协调器：统一选择项目记忆与已验证工作流程，超时自动放行，不保存用户记忆。'
              en: 'Memory & Learning coordinator for project memory and validated workflows, with bounded fail-open recall and no user-memory storage.'
          - name: 'dsh-missher-memory'
            spec: 'builtin:0.2.0'
            runtimeNames:
              - '@deepseek-ai/dsh-desktop-managed-memory'
            owner: 'Missher12'
            url: 'https://github.com/Missher12/dsh-missher-memory'
            category: 'memory'
            description:
              zh: '面向超长项目的本地审核式记忆：项目隔离、全文检索、可恢复自动压缩，并内置旧记忆库只读兼容。'
              en: 'Reviewed local memory for long projects, with project isolation, full-text search, reversible consolidation, and built-in read-only legacy compatibility.'
          - name: 'dsh-missher-evolution'
            spec: 'builtin:0.1.1'
            runtimeNames:
              - '@deepseek-ai/dsh-desktop-managed-evolution'
            owner: 'Missher12'
            url: 'https://github.com/Missher12/dsh-missher-evolution'
            category: 'agent'
            description:
              zh: 'Harness 特工版 MSE：只从验证结果学习有界流程规则，经 Trial 验证后才会参与任务。'
              en: 'Harness-native MSE that learns bounded workflow rules from verified outcomes and contributes only after Trial validation.'

    - id: desktop-system-update
      name: '@deepseek-ai/dsh-client-ui-settings-system-update'
