appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
electronVersion: 43.4.0
npmRebuild: true
nativeRebuilder: sequential
asar: true
asarUnpack:
  # The Harness profile fallback creates filesystem symlinks to installed
  # packages. Keep runtime packages physical so those links can target them.
  - "node_modules/**"
extraResources:
  - from: "update-metadata.json"
    to: "update-metadata.json"
files:
  - "lib/**"
  - "renderer/**"
  - "assets/**"
  - "desktop.cordis.patch.yml"
  - "THIRD_PARTY_NOTICES.md"
  - "node_modules/**"
  # Runtime JavaScript never needs source maps or TypeScript declarations.
  # Omitting them also keeps the unpacked Windows tree below NSIS path limits.
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/*.d.cts"
  - "!node_modules/**/*.d.mts"
  - "!node_modules/**/*.tsbuildinfo"
  # Credentials belong to the user's runtime home. Fail closed even if a
  # future dependency or staging change accidentally places one in the tree.
  - "!**/.env"
  - "!**/.env.*"
  - "!**/.npmrc"
  - "!**/.credentials.yaml"
  - "!**/credentials.json"
  - "!**/*.pem"
  - "!**/*.key"
  - "!**/*.p12"
  - "!**/.dsh/**"
  # The telemetry package accepts resources 2.x and the deployed graph already
  # carries a compatible top-level copy. Avoid a duplicate deeply nested tree.
  - "!node_modules/@deepseek-ai/dsh-session-telemetry-otel/node_modules/@opentelemetry/resources/**"
  - "!node_modules/node-pty/prebuilds/win32-arm64/**"
  - "!node_modules/node-pty/prebuilds/darwin-arm64/**"
  - "package.json"
mac:
  target:
    - target: dmg
      arch:
        - x64
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  identity: null
  files:
    - "!node_modules/node-pty/prebuilds/win32-x64/**"
dmg:
  title: DeepSeek Harness
  artifactName: "DeepSeek-Harness-${version}-mac-x64.${ext}"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  requestedExecutionLevel: asInvoker
  electronLanguages:
    - en-US
    - zh-CN
  files:
    - "!node_modules/node-pty/prebuilds/darwin-x64/**"
    - "!node_modules/node-pty/prebuilds/linux-*/**"
    - "!node_modules/@napi-rs/canvas-android-*/**"
    - "!node_modules/@napi-rs/canvas-darwin-*/**"
    - "!node_modules/@napi-rs/canvas-linux-*/**"
    - "!node_modules/@napi-rs/canvas-win32-arm64-msvc/**"
    - "!node_modules/@img/sharp-darwin-*/**"
    - "!node_modules/@img/sharp-freebsd-*/**"
    - "!node_modules/@img/sharp-libvips-darwin-*/**"
    - "!node_modules/@img/sharp-libvips-linux*/**"
    - "!node_modules/@img/sharp-linux*/**"
    - "!node_modules/@img/sharp-win32-arm64/**"
    - "!node_modules/@img/sharp-win32-ia32/**"
    - "!node_modules/@koromix/koffi-darwin-*/**"
    - "!node_modules/@koromix/koffi-freebsd-*/**"
    - "!node_modules/@koromix/koffi-linux-*/**"
    - "!node_modules/@koromix/koffi-openbsd-*/**"
    - "!node_modules/@koromix/koffi-win32-arm64/**"
    - "!node_modules/@koromix/koffi-win32-ia32/**"
    - "!node_modules/node-addon-require-builtin-darwin-*/**"
    - "!node_modules/node-addon-require-builtin-linux-*/**"
    - "!node_modules/node-addon-require-builtin-win32-arm64-msvc/**"
    - "!node_modules/node-addon-require-builtin-win32-ia32-msvc/**"
    - "!node_modules/**/*.pdb"
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: DeepSeek Harness
  artifactName: "DeepSeek-Harness-Setup-${version}-win-x64.${ext}"
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
directories:
  output: ../release
