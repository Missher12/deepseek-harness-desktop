<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: #05070c;
      color: #f6f8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 49% 42%, rgb(77 107 254 / 14%), transparent 33%),
        linear-gradient(145deg, #090c14 0%, #04060a 62%, #080b12 100%);
    }

    .startup {
      position: relative;
      isolation: isolate;
      display: grid;
      width: 100vw;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
    }

    .grain,
    .grid,
    .beam,
    .scan {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .grain {
      z-index: -1;
      opacity: .18;
      background-image:
        repeating-linear-gradient(0deg, transparent 0 3px, rgb(255 255 255 / 2%) 3px 4px),
        repeating-linear-gradient(90deg, transparent 0 5px, rgb(255 255 255 / 1.5%) 5px 6px);
    }

    .grid {
      z-index: -1;
      opacity: .2;
      background-image:
        linear-gradient(rgb(115 148 255 / 12%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(115 148 255 / 12%) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(circle at center, #000 0%, transparent 68%);
      transform: perspective(640px) rotateX(58deg) scale(1.65) translateY(34%);
      transform-origin: center bottom;
    }

    .beam {
      z-index: 0;
      width: 22vw;
      min-width: 180px;
      left: 39%;
      background: linear-gradient(90deg, transparent, rgb(77 107 254 / 22%), rgb(100 224 255 / 12%), transparent);
      filter: blur(22px);
      transform: skewX(-18deg) translateX(-180%);
      animation: beam-in 840ms cubic-bezier(.22, .74, .2, 1) 70ms both;
    }

    .scan {
      z-index: 4;
      height: 1px;
      top: 64%;
      background: linear-gradient(90deg, transparent 8%, #4d6bfe 42%, #76e9ff 50%, transparent 92%);
      box-shadow: 0 0 22px rgb(77 107 254 / 76%);
      transform: scaleX(0);
      animation: scan-in 620ms cubic-bezier(.2, .7, .2, 1) 170ms both;
    }

    .corner {
      position: absolute;
      width: 50px;
      height: 50px;
      border-color: rgb(139 162 255 / 34%);
      opacity: 0;
      animation: corner-in 420ms ease-out 380ms both;
    }

    .corner--tl { top: 26px; left: 26px; border-top: 1px solid; border-left: 1px solid; }
    .corner--br { right: 26px; bottom: 26px; border-right: 1px solid; border-bottom: 1px solid; }

    .brand {
      position: relative;
      z-index: 2;
      display: grid;
      width: min(580px, calc(100vw - 72px));
      grid-template-columns: 64px 1fr;
      align-items: center;
      gap: 22px;
      transform: translateY(13px);
    }

    .mark {
      position: relative;
      width: 64px;
      height: 64px;
      opacity: 0;
      transform: rotate(-18deg) scale(.72);
      animation: mark-in 660ms cubic-bezier(.17, .82, .25, 1.22) 90ms both;
    }

    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgb(121 229 255 / 60%);
      background: linear-gradient(135deg, rgb(77 107 254 / 86%), rgb(77 107 254 / 8%) 58%, transparent 59%);
      clip-path: polygon(0 0, 100% 0, 64% 38%, 100% 100%, 0 100%, 36% 62%);
      box-shadow: 0 0 24px rgb(77 107 254 / 32%);
    }

    .mark::after {
      inset: 16px;
      opacity: .74;
      transform: rotate(180deg);
    }

    .copy { min-width: 0; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      color: #75e7ff;
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .24em;
      text-transform: uppercase;
      opacity: 0;
      animation: copy-in 380ms ease-out 340ms both;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 1px;
      background: #75e7ff;
      box-shadow: 0 0 10px rgb(117 231 255 / 70%);
    }

    h1 {
      margin: 0;
      font-size: clamp(33px, 7vw, 58px);
      font-weight: 720;
      line-height: .96;
      letter-spacing: -.055em;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-18px);
      animation: title-in 560ms cubic-bezier(.2, .75, .2, 1) 160ms both;
    }

    h1 span {
      color: #8ba4ff;
      text-shadow: 0 0 24px rgb(77 107 254 / 28%);
    }

    .system-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 13px 0 0;
      color: rgb(226 232 255 / 54%);
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: 0;
      animation: copy-in 420ms ease-out 410ms both;
    }

    .pulse {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #75e7ff;
      box-shadow: 0 0 9px #75e7ff;
      animation: pulse 1.4s ease-in-out 720ms infinite;
    }

    .rail {
      position: absolute;
      z-index: 2;
      right: 34px;
      top: 50%;
      display: grid;
      gap: 7px;
      transform: translateY(-50%);
      opacity: 0;
      animation: corner-in 400ms ease-out 490ms both;
    }

    .rail i {
      display: block;
      width: 18px;
      height: 2px;
      background: rgb(139 162 255 / 24%);
    }

    .rail i:nth-child(2),
    .rail i:nth-child(3) { background: #4d6bfe; box-shadow: 0 0 9px rgb(77 107 254 / 60%); }

    @keyframes beam-in { to { transform: skewX(-18deg) translateX(260%); } }
    @keyframes scan-in { 35% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes corner-in { to { opacity: 1; } }
    @keyframes mark-in { to { opacity: 1; transform: rotate(0) scale(1); } }
    @keyframes title-in { to { opacity: 1; transform: translateX(0); } }
    @keyframes copy-in { to { opacity: 1; } }
    @keyframes pulse { 50% { opacity: .32; transform: scale(.7); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media (max-width: 520px) {
      .brand { grid-template-columns: 50px 1fr; gap: 16px; width: calc(100vw - 48px); }
      .mark { width: 50px; height: 50px; }
      .rail { display: none; }
      .corner--tl { top: 18px; left: 18px; }
      .corner--br { right: 18px; bottom: 18px; }
    }
  </style>
</head>
<body>
  <main class="startup" data-macos-startup aria-label="DeepSeek Harness 正在启动">
    <div class="grain" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <div class="beam" aria-hidden="true"></div>
    <div class="scan" aria-hidden="true"></div>
    <div class="corner corner--tl" aria-hidden="true"></div>
    <div class="corner corner--br" aria-hidden="true"></div>
    <section class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div class="copy">
        <div class="eyebrow">Local intelligence system</div>
        <h1>DeepSeek <span>Harness</span></h1>
        <p class="system-line"><span class="pulse" aria-hidden="true"></span>Desktop runtime initialization</p>
      </div>
    </section>
    <div class="rail" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </main>
</body>
</html>
