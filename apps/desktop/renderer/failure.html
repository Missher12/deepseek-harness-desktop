<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepSeek Harness</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    main { width: min(460px, calc(100vw - 64px)); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 20px; font-weight: 650; letter-spacing: -.015em; }
    p { min-height: 42px; margin: 0 auto 24px; font-size: 14px; line-height: 1.5; opacity: .68; }
    .actions { display: flex; justify-content: center; gap: 10px; }
    button { appearance: none; padding: 8px 14px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 9px; background: color-mix(in srgb, CanvasText 7%, Canvas); color: CanvasText; font: inherit; cursor: pointer; }
    button.primary { border-color: transparent; background: #4f6df5; color: white; }
    button:focus-visible { outline: 3px solid color-mix(in srgb, #4f6df5 45%, transparent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>DeepSeek Harness could not start.</h1>
    <p id="reason">请重试，或打开日志查看详细信息。</p>
    <div class="actions">
      <button type="button" data-action="open-logs">打开日志</button>
      <button type="button" data-action="quit">退出</button>
      <button type="button" class="primary" data-action="retry">重试</button>
    </div>
  </main>
  <script>
    const reasons = {
      'runtime-conflict': '另一个 DeepSeek Harness 正在使用同一数据目录。请先退出旧窗口，再重试。',
      startup: 'Harness 运行时未能完成启动。',
      renderer: '应用界面意外退出。',
      'runtime-exit': 'Harness 运行时意外退出。',
    }
    const actions = ['retry', 'open-logs', 'quit']
    const reason = new URLSearchParams(location.search).get('reason')
    document.querySelector('#reason').textContent = reasons[reason] ?? '请重试，或打开日志查看详细信息。'
    for (const action of actions) {
      document.querySelector(`[data-action="${action}"]`).addEventListener('click', () => {
        window.dshDesktop?.recover(action)
      })
    }
  </script>
</body>
</html>
