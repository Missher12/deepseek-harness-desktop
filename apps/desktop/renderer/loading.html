<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: #f6f7fb;
      color: #171a21;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgb(77 107 254 / 9%), transparent 36%),
        #f6f7fb;
    }

    .startup {
      display: grid;
      width: 100vw;
      min-height: 100vh;
      place-items: center;
    }

    .brand {
      display: grid;
      width: min(300px, calc(100vw - 48px));
      justify-items: center;
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgb(77 107 254 / 24%);
    }

    h1 {
      margin: 17px 0 6px;
      font-size: 25px;
      font-weight: 600;
      line-height: 30px;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 0;
      color: #697386;
      font-size: 12px;
      line-height: 18px;
    }

    .progress {
      position: relative;
      width: 100%;
      height: 5px;
      margin-top: 27px;
      overflow: hidden;
      border-radius: 999px;
      background: #e4e8f2;
    }

    .progress i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 34%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4d6bfe, #6f8dff 68%, #79e8ff);
      box-shadow: 0 0 10px rgb(77 107 254 / 34%);
      animation: progress-sweep 1.35s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 10px;
      color: #778197;
      font-family: "SF Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
      font-size: 10px;
      line-height: 14px;
    }

    .meta span:last-child { color: #4a5568; }

    @keyframes progress-sweep {
      from { transform: translateX(-110%); }
      to { transform: translateX(400%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress i {
        animation: none;
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>
  <main class="startup" data-desktop-startup aria-label="DeepSeek Harness 正在启动">
    <section class="brand">
      <img class="icon" src="../assets/icon-source.png" alt="">
      <h1>DeepSeek Harness</h1>
      <p class="subtitle">正在准备你的工作区</p>
      <div
        class="progress"
        data-desktop-local-progress
        role="progressbar"
        aria-label="正在启动"
        aria-valuetext="正在启动本地服务"
      ><i aria-hidden="true"></i></div>
      <div class="meta"><span>启动本地服务</span><span>准备中</span></div>
    </section>
  </main>
</body>
</html>
