[workspace]
members = ["crates/protocol", "crates/core", "crates/helper"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
computer-use-core = { path = "crates/core" }
computer-use-protocol = { path = "crates/protocol" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
